name: Fasted
options:
  bundleIdPrefix: com.grusy
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"


targets:
  Fasted:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Fasted
      - path: Shared
    dependencies:
      - target: FastedWidgets
      - target: FastedWatch
    settings:
      base:
        INFOPLIST_FILE: Fasted/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Fasted/Fasted.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FastedWidgets
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FastedWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: FastedWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast.Widgets
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: FastedWidgets/FastedWidgets.entitlements
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: FastedWatch
      - path: Shared
    dependencies:
      - target: FastedWatchWidgets
    settings:
      base:
        INFOPLIST_FILE: FastedWatch/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: FastedWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FastedWatch/FastedWatch.entitlements
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: FastedWatchWidgets
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FastedWatchWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: FastedWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast.watchkitapp.Widgets
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: FastedWatchWidgets/FastedWatchWidgets.entitlements
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FastedTests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FastedUITests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

schemes:
  Fasted:
    build:
      targets:
        Fasted: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FastedTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FastedWidgets:
    build:
      targets:
        FastedWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FastedWatch:
    build:
      targets:
        FastedWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FastedWatchWidgets:
    build:
      targets:
        FastedWatchWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FastedTests:
    build:
      targets:
        FastedTests: all
    test:
      config: Debug
      targets:
        - FastedTests

  FastedUITests:
    build:
      targets:
        FastedUITests: all
    test:
      config: Debug
      targets:
        - FastedUITests
