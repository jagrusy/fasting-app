name: Fasted
options:
  bundleIdPrefix: com.grusy
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:
  Fasted:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Fasted
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: Fasted/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FastedTests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FastedUITests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

schemes:
  Fasted:
    build:
      targets:
        Fasted: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FastedTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  FastedTests:
    build:
      targets:
        FastedTests: all
    test:
      config: Debug
      targets:
        - FastedTests

  FastedUITests:
    build:
      targets:
        FastedUITests: all
    test:
      config: Debug
      targets:
        - FastedUITests
