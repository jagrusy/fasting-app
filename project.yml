name: Fasted
options:
  bundleIdPrefix: com.grusy
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_PREVIEWS: "YES"
    SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    SUPPORTS_MACCATALYST: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

targets:
  Fasted:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Fasted
    settings:
      base:
        INFOPLIST_FILE: Fasted/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFast
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        # Info.plist's CFBundleVersion reads this. CI overrides it per build with the next
        # unused TestFlight build number; this default just keeps local builds working.
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Release is what `xcodebuild archive` uses, so it must ask for a *distribution*
        # identity. This was previously "iPhone Developer" in both configs, which made
        # automatic signing hunt for an "iOS App Development" profile when archiving for the
        # App Store and fail — declared here so regenerating the project keeps it correct.
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution

  FastedTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FastedTests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FastedUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FastedUITests
    dependencies:
      - target: Fasted
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grusy.SolsticeFastUITests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

# Schemes were previously not defined anywhere, so Xcode auto-created them implicitly. The
# auto-created "FastedTests" scheme picked up *both* test targets, which is why CI's separate
# "Run UI Tests" step re-ran the UI suite that "Run Unit Tests" had already run. Declaring them
# makes the split explicit and reproducible instead of dependent on Xcode's autocreation rules.
schemes:
  Fasted:
    build:
      targets:
        Fasted: all
    test:
      targets:
        - FastedTests
        - FastedUITests
  FastedTests:
    build:
      targets:
        Fasted: [test]
        FastedTests: [test]
    test:
      targets:
        - FastedTests
  FastedUITests:
    build:
      targets:
        Fasted: [test]
        FastedUITests: [test]
    test:
      targets:
        - FastedUITests
