name: Deploy to TestFlight & App Store

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: 'Production lanes require protected-environment human approval'
        required: true
        default: beta
        type: choice
        options: [beta, release, screenshots_upload]
      ci_run_id:
        description: 'Successful main-push CI run ID for this exact commit'
        required: true
        type: string
      commit_sha:
        description: 'Full 40-character SHA of the current main commit verified by CI'
        required: true
        type: string
      version_override:
        description: 'Optional marketing version override (e.g. 1.2.0). Leave blank to resolve automatically.'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

# One publisher for this app across automatic and manual runs.
concurrency:
  group: solstice-distribution
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact CI commit and release policy
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      lane: ${{ steps.gate.outputs.lane }}
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - name: Check out trusted workflow policy only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts/release_gate.py
          sparse-checkout-cone-mode: false
      - name: Verify source and selected environment protection
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTORS: ${{ vars.RELEASE_ACTORS || github.repository_owner }}
        run: python3 scripts/release_gate.py

  deploy:
    name: Publish verified source (${{ needs.verify.outputs.lane }})
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    # Signing/publishing credentials belong only in these main-restricted environments,
    # never repository secrets. Both policy passes validate the selected environment.
    environment:
      name: ${{ needs.verify.outputs.environment }}
    steps:
      - name: Check out trusted workflow policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-policy
          persist-credentials: false
          sparse-checkout: scripts/release_gate.py
          sparse-checkout-cone-mode: false
      - name: Recheck CI and verify actual human approval before signing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTORS: ${{ vars.RELEASE_ACTORS || github.repository_owner }}
        run: python3 .release-policy/scripts/release_gate.py --verify-approval
      - name: Check out the exact verified application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          path: app
          persist-credentials: true
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Resolve Version & Build Metadata
        id: version
        working-directory: app
        env:
          VERSION_OVERRIDE: ${{ github.event.inputs.version_override }}
        run: ./scripts/resolve_version.sh
      - name: Generate Xcode Project
        working-directory: app
        run: xcodegen generate
      # Imports the App Store distribution certificate into a keychain that exists only for this
      # job — the runner itself is destroyed afterward, so nothing persists. get_provisioning
      # _profile (sigh) in the Fastfile can bind a profile to this certificate via the API key
      # above; it just can't create the certificate itself, which is what this step is for.
      # See FASTLANE_SETUP.md, "Set up Code Signing (certificate secret)", for how BUILD_
      # CERTIFICATE_BASE64 / P12_PASSWORD are generated.
      - name: Import Code-Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/deploy-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # No `-t cert`: that imports only the certificate and silently drops the private key,
          # which surfaces much later as xcodebuild's confusing "No signing certificate ... with
          # a private key was found". Letting security infer the type from the pkcs12 brings in
          # the full identity (certificate + key).
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Fail here, with a clear message, rather than 15 confusing lines deep in an xcodebuild
          # archive error. find-identity -p codesigning only lists complete identities, so this
          # verifies the private key actually came across.
          echo "Signing identities available to the build:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::No 'Apple Distribution' identity with a private key in the CI keychain."
            echo "::error::BUILD_CERTIFICATE_BASE64 must be a .p12 exported from Keychain Access"
            echo "::error::under 'My Certificates' (which includes the private key), not 'Certificates'."
            exit 1
          fi

      - name: Run verified Fastlane lane
        working-directory: app
        env:
          SOLSTICE_VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
          SOLSTICE_VERIFIED_LANE: ${{ needs.verify.outputs.lane }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane "$SOLSTICE_VERIFIED_LANE"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/deploy-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12"
