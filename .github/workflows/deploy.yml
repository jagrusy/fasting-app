name: Deploy to TestFlight & App Store

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to execute (overrides the automatic choice below)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - beta
          - release
      skip_tests:
        description: 'Skip the pre-deploy test run (for iterating on signing/deploy config)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Fastlane Deploy
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Both steps below exist only to run the pre-deploy test suite, and that suite takes
      # 6-14 minutes — while the deploy steps after it take seconds. When iterating on signing
      # or deploy config (where the code is unchanged and CI already tested it on the PR),
      # dispatch with skip_tests=true to get a ~1 minute feedback loop instead of ~15.
      - name: Discover iOS Simulator
        id: sim
        if: ${{ !inputs.skip_tests }}
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | jq -r '.devices[] | select(. != []) | .[] | select(.isAvailable == true and (.name | contains("iPhone"))) | .name' | head -n 1)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 15"
          fi
          echo "Found available iOS Simulator: $SIM_NAME"
          echo "name=$SIM_NAME" >> $GITHUB_OUTPUT

      - name: Run Tests Before Deploy
        if: ${{ !inputs.skip_tests }}
        run: |
          xcodebuild test \
            -project Fasted.xcodeproj \
            -scheme FastedTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -quiet

      - name: Determine lane
        id: lane
        run: |
          # A manual dispatch pick always wins. Otherwise: a `v*` tag push means release
          # (App Store review); a plain push to main means beta (TestFlight).
          if [ -n "${{ github.event.inputs.lane }}" ]; then
            LANE="${{ github.event.inputs.lane }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            LANE="release"
          else
            LANE="beta"
          fi
          echo "Selected lane: $LANE"
          echo "name=$LANE" >> $GITHUB_OUTPUT

      # Imports the App Store distribution certificate into a keychain that exists only for this
      # job — the runner itself is destroyed afterward, so nothing persists. get_provisioning
      # _profile (sigh) in the Fastfile can bind a profile to this certificate via the API key
      # above; it just can't create the certificate itself, which is what this step is for.
      # See FASTLANE_SETUP.md, "Set up Code Signing (certificate secret)", for how BUILD_
      # CERTIFICATE_BASE64 / P12_PASSWORD are generated.
      - name: Import Code-Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/deploy-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # No `-t cert`: that imports only the certificate and silently drops the private key,
          # which surfaces much later as xcodebuild's confusing "No signing certificate ... with
          # a private key was found". Letting security infer the type from the pkcs12 brings in
          # the full identity (certificate + key).
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Fail here, with a clear message, rather than 15 confusing lines deep in an xcodebuild
          # archive error. find-identity -p codesigning only lists complete identities, so this
          # verifies the private key actually came across.
          echo "Signing identities available to the build:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution"; then
            echo "::error::No 'Apple Distribution' identity with a private key in the CI keychain."
            echo "::error::BUILD_CERTIFICATE_BASE64 must be a .p12 exported from Keychain Access"
            echo "::error::under 'My Certificates' (which includes the private key), not 'Certificates'."
            exit 1
          fi

      - name: Run Fastlane Deployment
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: bundle exec fastlane ${{ steps.lane.outputs.name }}
