name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        # Same selection as deploy.yml, so CI builds with the toolchain that ships to TestFlight.
        run: |
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Discover Simulator
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | jq -r '.devices[] | select(. != []) | .[] | select(.isAvailable == true and (.name | contains("iPhone"))) | .name' | head -n 1)
          if [ -z "$SIM_NAME" ]; then
            echo "::error::No available iPhone simulator for the selected Xcode"
            exit 1
          fi
          SIM_UDID=$(xcrun simctl list devices available -j | jq -r --arg n "$SIM_NAME" '[.devices[] | .[] | select(.isAvailable == true and .name == $n)][0].udid')
          echo "Found available iOS Simulator: $SIM_NAME ($SIM_UDID)"
          echo "name=$SIM_NAME" >> $GITHUB_OUTPUT
          echo "udid=$SIM_UDID" >> $GITHUB_OUTPUT

      # The first UI test launch on a cold simulator can exceed XCUITest's launch timeout
      # ("Timed out while launching application via Xcode"), which failed main's CI for c04d7bd
      # before any test code ran. Boot and wait for the device to finish booting up front.
      - name: Boot Simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth, but Fasted.xcodeproj is committed so it can be opened
      # without XcodeGen. Compare before version resolution rewrites MARKETING_VERSION in
      # project.yml, print the exact diff, and fail at the end of the job so a stale project never
      # hides build or test results.
      - name: Check committed Xcode project matches project.yml
        id: drift
        run: |
          xcodegen generate
          git add --intent-to-add -- Fasted.xcodeproj
          if git diff --quiet -- Fasted.xcodeproj; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fasted.xcodeproj differs from what project.yml generates. Diff:"
            git --no-pager diff -- Fasted.xcodeproj
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Version & Build Metadata
        id: version
        run: ./scripts/resolve_version.sh

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme Fasted \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build iOS Widget Extension
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWidgets \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build watchOS Application
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWatch \
            -destination "generic/platform=watchOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build watchOS Widget Extension
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWatchWidgets \
            -destination "generic/platform=watchOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Fasted.xcodeproj \
            -scheme FastedTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults-Unit.xcresult

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project Fasted.xcodeproj \
            -scheme FastedUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults-UI.xcresult

      - name: Fail if the committed Xcode project is stale
        if: steps.drift.outputs.stale == 'true'
        run: |
          echo "::error::Fasted.xcodeproj is out of date with project.yml. See the 'Check committed Xcode project' step for the diff."
          exit 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.xcresult"

  release-policy:
    name: Release Policy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test fail-closed release decisions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Test Fastlane entry guards
        run: ruby fastlane/tests/release_guard_test.rb

  required:
    name: CI Required
    if: always()
    needs: [lint, build-and-test, release-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os, sys
          jobs = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          if failed:
              print(f'Required checks did not pass: {failed}', file=sys.stderr)
              sys.exit(1)
          print('Every required lint, build, unit/UI and release-policy job passed.')
          PYCODE
