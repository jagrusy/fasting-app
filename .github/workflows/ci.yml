name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Discover Simulator
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list devices available -j | jq -r '.devices[] | select(. != []) | .[] | select(.isAvailable == true and (.name | contains("iPhone"))) | .name' | head -n 1)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16"
          fi
          echo "Found available iOS Simulator: $SIM_NAME"
          echo "name=$SIM_NAME" >> $GITHUB_OUTPUT

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme Fasted \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build iOS Widget Extension
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWidgets \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build watchOS Application
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWatch \
            -destination "generic/platform=watchOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Build watchOS Widget Extension
        run: |
          xcodebuild build \
            -project Fasted.xcodeproj \
            -scheme FastedWatchWidgets \
            -destination "generic/platform=watchOS Simulator" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Fasted.xcodeproj \
            -scheme FastedTests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults-Unit.xcresult

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project Fasted.xcodeproj \
            -scheme FastedUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults-UI.xcresult

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.xcresult"
